services:
  redis:
    image: redis:7-alpine
    container_name: govpress-mcp-redis-1
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: govpress-mcp-qdrant-1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-latest
    gpus: all
    container_name: govpress-mcp-tei-1
    command:
      - --model-id
      - BAAI/bge-m3
      - --max-batch-tokens
      - "32768"
      - --max-client-batch-size
      - "64"
    environment:
      HF_HUB_CACHE: /data
      HUGGINGFACE_HUB_CACHE: /data
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "18080:80"
    volumes:
      - ./data/tei-cache:/data
    restart: unless-stopped

  mcp:
    image: govpress-mcp-converter:latest
    container_name: govpress-mcp-server-1
    working_dir: /app
    command:
      - python
      - -c
      - |
        from govpress_mcp.server import app, AcceptCompatMiddleware, _SETTINGS
        import uvicorn
        uvicorn.run(
            AcceptCompatMiddleware(app.streamable_http_app()),
            host="0.0.0.0",
            port=_SETTINGS.mcp_port,
            log_level="info",
        )
    environment:
      DATA_ROOT: /app/data
      DB_PATH: /app/data/govpress.db
      QDRANT_URL: http://qdrant:6333
      TEI_URL: http://tei:80
      MCP_PORT: "8000"
      USAGE_LOG_PATH: /app/data/fetch-log/mcp-usage.jsonl
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - qdrant
      - tei
    restart: unless-stopped

volumes:
  redis-data:
    external: true
    name: 56afd3755d0ca75fda88002fa8ef44db7aa568b276490495876a9bbff9fb4ca6
